name: conditional
on:
    workflow_dispatch:
        inputs:
            enviro:
                description: "type of env"
                required: true
                default: "production"

jobs:
    conditional:
        if: ${{ github.event.inputs.enviro == 'production' }}
        runs-on: ubuntu-latest
        steps:
            - run: echo "this is production"
    condition:
        if: ${{ github.event.inputs.enviro == 'staging' || github.events.inputs.enviro == 'development' }}
        runs-on: ubuntu-latest
        steps:
            - run: echo "this is testing"
    always:
        runs-on: ubuntu-latest
        steps:
            - run: echo ${{github.event.inputs.enviro}}